<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="AI Agent Security Skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>

  <!-- shield -->
  <g transform="translate(90,70)">
    <path d="M90 0 L170 30 V100 C170 160 135 195 90 215 C45 195 10 160 10 100 V30 Z"
          fill="#0f172a" stroke="url(#accent)" stroke-width="5"/>
    <circle cx="90" cy="95" r="34" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="90" cy="95" r="9" fill="#22d3ee"/>
    <path d="M90 61 V45 M90 129 V145 M56 95 H40 M124 95 H140" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="320" y="130" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="#f8fafc">AI Agent Security</text>
  <text x="320" y="190" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="url(#accent)">Skills</text>
  <text x="320" y="232" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#94a3b8">Threat modeling · Red team · Defense — for Claude Code and AI agents</text>

  <!-- chips -->
  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="600">
    <rect x="320" y="256" width="150" height="34" rx="17" fill="#0e7490" fill-opacity="0.35" stroke="#22d3ee"/>
    <text x="395" y="278" text-anchor="middle" fill="#67e8f9">Threat Model</text>
    <rect x="484" y="256" width="120" height="34" rx="17" fill="#9f1239" fill-opacity="0.35" stroke="#fb7185"/>
    <text x="544" y="278" text-anchor="middle" fill="#fda4af">Red Team</text>
    <rect x="618" y="256" width="120" height="34" rx="17" fill="#065f46" fill-opacity="0.35" stroke="#34d399"/>
    <text x="678" y="278" text-anchor="middle" fill="#6ee7b7">Defense</text>
  </g>
</svg>
