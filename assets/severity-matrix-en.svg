<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="Risk matrix">
  <rect width="900" height="560" rx="16" fill="#0b1020"/>
  <text x="450" y="44" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#f8fafc">Risk Matrix</text>
  <text x="450" y="70" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#94a3b8">Risk = likelihood × impact (1–5 each)</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0b1020">
    <!-- rows: impact 5..1 (top to bottom), cols: probability 1..5 -->
    <g transform="translate(150,100)">
      <rect x="0" y="0" width="116" height="66" rx="8" fill="#facc15"/>
      <text x="58" y="41">5</text>
      <rect x="120" y="0" width="116" height="66" rx="8" fill="#f97316"/>
      <text x="178" y="41">10</text>
      <rect x="240" y="0" width="116" height="66" rx="8" fill="#ef4444"/>
      <text x="298" y="41">15</text>
      <rect x="360" y="0" width="116" height="66" rx="8" fill="#ef4444"/>
      <text x="418" y="41">20</text>
      <rect x="480" y="0" width="116" height="66" rx="8" fill="#ef4444"/>
      <text x="538" y="41">25</text>
      <rect x="0" y="70" width="116" height="66" rx="8" fill="#4ade80"/>
      <text x="58" y="111">4</text>
      <rect x="120" y="70" width="116" height="66" rx="8" fill="#facc15"/>
      <text x="178" y="111">8</text>
      <rect x="240" y="70" width="116" height="66" rx="8" fill="#f97316"/>
      <text x="298" y="111">12</text>
      <rect x="360" y="70" width="116" height="66" rx="8" fill="#ef4444"/>
      <text x="418" y="111">16</text>
      <rect x="480" y="70" width="116" height="66" rx="8" fill="#ef4444"/>
      <text x="538" y="111">20</text>
      <rect x="0" y="140" width="116" height="66" rx="8" fill="#4ade80"/>
      <text x="58" y="181">3</text>
      <rect x="120" y="140" width="116" height="66" rx="8" fill="#facc15"/>
      <text x="178" y="181">6</text>
      <rect x="240" y="140" width="116" height="66" rx="8" fill="#facc15"/>
      <text x="298" y="181">9</text>
      <rect x="360" y="140" width="116" height="66" rx="8" fill="#f97316"/>
      <text x="418" y="181">12</text>
      <rect x="480" y="140" width="116" height="66" rx="8" fill="#ef4444"/>
      <text x="538" y="181">15</text>
      <rect x="0" y="210" width="116" height="66" rx="8" fill="#4ade80"/>
      <text x="58" y="251">2</text>
      <rect x="120" y="210" width="116" height="66" rx="8" fill="#4ade80"/>
      <text x="178" y="251">4</text>
      <rect x="240" y="210" width="116" height="66" rx="8" fill="#facc15"/>
      <text x="298" y="251">6</text>
      <rect x="360" y="210" width="116" height="66" rx="8" fill="#facc15"/>
      <text x="418" y="251">8</text>
      <rect x="480" y="210" width="116" height="66" rx="8" fill="#f97316"/>
      <text x="538" y="251">10</text>
      <rect x="0" y="280" width="116" height="66" rx="8" fill="#4ade80"/>
      <text x="58" y="321">1</text>
      <rect x="120" y="280" width="116" height="66" rx="8" fill="#4ade80"/>
      <text x="178" y="321">2</text>
      <rect x="240" y="280" width="116" height="66" rx="8" fill="#4ade80"/>
      <text x="298" y="321">3</text>
      <rect x="360" y="280" width="116" height="66" rx="8" fill="#4ade80"/>
      <text x="418" y="321">4</text>
      <rect x="480" y="280" width="116" height="66" rx="8" fill="#facc15"/>
      <text x="538" y="321">5</text>
    </g>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    <text x="450" y="486">Likelihood →</text>
    <text x="150" y="472" text-anchor="start" font-size="12">1</text>
    <text x="728" y="472" text-anchor="start" font-size="12">5</text>
    <text transform="translate(100,275) rotate(-90)">Impact →</text>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#e2e8f0">
    <rect x="150" y="520" width="14" height="14" rx="3" fill="#4ade80"/><text x="170" y="532">Low (1–4)</text>
    <rect x="270" y="520" width="14" height="14" rx="3" fill="#facc15"/><text x="290" y="532">Medium (5–9)</text>
    <rect x="410" y="520" width="14" height="14" rx="3" fill="#f97316"/><text x="430" y="532">High (10–14)</text>
    <rect x="545" y="520" width="14" height="14" rx="3" fill="#ef4444"/><text x="565" y="532">Critical (15–25)</text>
  </g>
</svg>
